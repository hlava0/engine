[workspace]
resolver = "2"
members = [
    "crates/engine-rhi",
    "crates/engine-gpu-driven",
    "crates/engine-rt-nrd",
    "crates/engine-compute-ml",
    "crates/engine-assets",
    "crates/engine-gameplay",
    "crates/engine-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
gpu-allocator = { version = "0.27", default-features = false, features = ["vulkan"] }
bytemuck = { version = "1.18", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga"] }
hecs = "0.10"
rhai = { version = "1.20", default-features = false, features = ["std", "sync"] }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
