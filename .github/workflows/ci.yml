name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  ENGINE_DISABLE_NRD: "1"

jobs:
  check-clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Vulkan headers, glslang-tools, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslang-tools libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, -D warnings, SVGF fallback)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run CPU / unit tests (no hardware GPU required)
        run: |
          cargo test --workspace --lib
          cargo test -p engine-gameplay
          cargo test -p engine-assets glb_in_memory_roundtrip
